name: release

# Construit le moteur Windows (ano.exe + onnxruntime.dll) à chaque étiquette vX.Y.Z
# et le publie en pièce jointe de la release. Le mod le télécharge ensuite, empreinte
# SHA-256 vérifiée (engine-manifest.json).
on:
  push:
    tags: ['v*']
    branches: [main]      # compilation de contrôle à chaque modification (sans release)
  workflow_dispatch:

permissions:
  contents: write

env:
  ORT_VERSION: '1.22.0'   # doit correspondre à la version attendue par la crate `ort` (rc.10)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilation du moteur
        working-directory: engine
        run: cargo build --release --locked

      - name: Récupération de onnxruntime.dll
        shell: pwsh
        run: |
          $zip = "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath ort
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "ort/onnxruntime-win-x64-$env:ORT_VERSION/lib/onnxruntime.dll" dist/
          Copy-Item engine/target/release/ano.exe dist/

      - name: Archive et empreinte
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath ano-windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 ano-windows-x64.zip).Hash.ToLower()
          "$hash  ano-windows-x64.zip" | Out-File -Encoding ascii SHA256.txt
          Get-Content SHA256.txt

      - name: Conserver l'archive (compilation de contrôle)
        uses: actions/upload-artifact@v4
        with:
          name: ano-windows-x64
          path: |
            ano-windows-x64.zip
            SHA256.txt

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-Content SHA256.txt).Split(' ')[0]
          gh release create $env:GITHUB_REF_NAME ano-windows-x64.zip SHA256.txt --title $env:GITHUB_REF_NAME --notes "Moteur d'anonymisation Windows. SHA-256 : $hash (à reporter dans engine-manifest.json)."
